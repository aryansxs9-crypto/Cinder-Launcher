<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ember Launcher</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg-0:#07070b;
    --glass: rgba(255,255,255,0.045);
    --border: rgba(255,255,255,0.10);
    --border-hi: rgba(255,255,255,0.22);
    --ink: #f3f1f6;
    --ink-dim: #9d99ac;
    --ink-dimmer: #6b6779;
    --ember-1:#34e0a1;
    --ember-2:#0ea968;
    --ok:#3ddc84;
    --radius-lg: 22px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter', -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg-0);
    color: var(--ink);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{font-family:'Sora', sans-serif;}
  button{font-family:inherit;}

  .bg-glow{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(700px 500px at 8% 8%, rgba(52,224,161,0.16), transparent 60%),
      radial-gradient(800px 600px at 96% 90%, rgba(14,169,104,0.14), transparent 60%),
      linear-gradient(180deg, #08080d 0%, #0a0a10 100%);
  }

  .app{position:relative; z-index:1; display:flex; flex-direction:column; min-height:100vh; max-width:1360px; margin:0 auto; padding:22px 28px 40px;}

  .titlebar{display:flex; align-items:center; justify-content:space-between; padding:2px 4px 18px; color:var(--ink-dimmer); font-size:12.5px;}
  .titlebar .tb-left{display:flex; align-items:center; gap:8px;}
  .tb-dot{width:7px;height:7px;border-radius:50%;background:var(--ember-1);}
  .tb-icons{display:flex; gap:16px; font-size:14px;}
  .tb-icons span{cursor:pointer; opacity:.6; transition:.2s opacity;}
  .tb-icons span:hover{opacity:1;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-radius: var(--radius-lg);
    background: var(--glass); border:1px solid var(--border);
    backdrop-filter: blur(24px) saturate(140%);
  }
  .brand{display:flex; align-items:center; gap:12px; font-weight:800; font-size:19px;}
  .brand .mark{
    width:34px; height:34px; border-radius:10px;
    background:linear-gradient(145deg, var(--ember-1), var(--ember-2));
  }
  .nav-tabs{display:flex; gap:4px; background:rgba(0,0,0,0.25); padding:4px; border-radius:12px; border:1px solid var(--border);}
  .nav-tab{
    padding:9px 18px; border-radius:9px; font-size:14px; font-weight:600; color:var(--ink-dim);
    cursor:pointer; border:none; background:transparent; transition:.25s;
  }
  .nav-tab.active{color:#fff; background:linear-gradient(135deg, rgba(52,224,161,.22), rgba(14,169,104,.22)); box-shadow:inset 0 0 0 1px rgba(52,224,161,0.35);}
  
  /* Quick config flyout */
  .quick-config-wrapper{position:relative;}
  .quick-btn{
    display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:12px;
    background:rgba(52,224,161,0.12); border:1px solid rgba(52,224,161,0.3);
    color:var(--ember-1); font-weight:700; font-size:13.5px; cursor:pointer; transition:.2s;
  }
  .quick-btn:hover{background:rgba(52,224,161,0.22);}
  .quick-flyout{
    position:absolute; top:calc(100% + 10px); right:0; width:320px; z-index:100;
    background:rgba(18,16,24,0.96); border:1px solid var(--border-hi); border-radius:16px;
    padding:18px; backdrop-filter:blur(24px); box-shadow:0 30px 60px -20px rgba(0,0,0,0.8);
    display:none; flex-direction:column; gap:14px; animation:fadeUp .2s ease;
  }
  .quick-flyout.open{display:flex;}
  .quick-row{display:flex; flex-direction:column; gap:6px;}
  .quick-label{font-size:12px; font-weight:700; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.5px;}
  .quick-input{
    width:100%; padding:9px 12px; border-radius:9px; background:rgba(255,255,255,0.05);
    border:1px solid var(--border); color:var(--ink); font-size:13.5px; font-family:inherit;
  }
  .quick-select-row{display:grid; grid-template-columns:1fr 1fr; gap:8px;}

  .page{display:none; margin-top:22px; animation:fadeUp .35s ease;}
  .page.active{display:block;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  .glass{
    background:var(--glass); border:1px solid var(--border); border-radius: var(--radius-lg);
    backdrop-filter: blur(22px);
  }

  .home-grid{display:grid; grid-template-columns: 1fr 328px; gap:20px; margin-top:20px;}
  .player-card{padding:26px 30px 28px;}
  .player-top{display:flex; align-items:flex-start; justify-content:space-between;}
  .player-name{display:flex; align-items:center; gap:12px;}
  .player-name h1{margin:0; font-size:26px; font-weight:700;}
  .badge{font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px;}
  .badge.offline{background:rgba(255,255,255,0.08); color:var(--ink-dim); border:1px solid var(--border);}
  .badge.online{background:rgba(61,220,132,0.14); color:var(--ok); border:1px solid rgba(61,220,132,0.3);}
  .sub{color:var(--ink-dimmer); font-size:13px; margin-top:3px;}
  .top-actions{display:flex; gap:10px;}
  .ghost-btn{
    display:flex; align-items:center; gap:7px; padding:9px 16px; border-radius:10px;
    font-size:13.5px; font-weight:600; color:var(--ink); background:rgba(255,255,255,0.045);
    border:1px solid var(--border); cursor:pointer; transition:.25s;
  }
  .avatar-stage{
    height:220px; position:relative; margin:8px 0 4px; border-radius:16px; overflow:hidden;
    background:radial-gradient(160px 60px at 50% 92%, rgba(20,200,140,.35), transparent 70%);
  }

  .controls-row{display:flex; align-items:center; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .pill-select{
    padding:10px 15px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid var(--border);
    font-size:13.5px; font-weight:600; user-select:none;
  }

  .play-btn{
    margin-top:18px; width:100%; padding:18px; border:none; border-radius:16px; cursor:pointer;
    font-family:'Sora',sans-serif; font-weight:700; font-size:16.5px; color:#04140d;
    background:linear-gradient(120deg, var(--ember-1), var(--ember-2));
    display:flex; align-items:center; justify-content:center; gap:10px; transition:.2s;
  }
  .play-btn.stop{background:linear-gradient(120deg,#3a3a44,#232228); color:#f3f1f6;}

  .session-card{padding:20px 22px;}
  .stat-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  input[type=range]{-webkit-appearance:none; width:100%; height:5px; border-radius:6px; background:linear-gradient(90deg, var(--ember-1), var(--ember-2)) 0/70% 100% no-repeat, rgba(255,255,255,0.1); margin:8px 0 4px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; cursor:pointer;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding-top:14px; margin-top:14px; border-top:1px solid var(--border);}
  .switch{width:38px; height:22px; border-radius:99px; background:rgba(255,255,255,0.12); position:relative; cursor:pointer; border:1px solid var(--border); transition:.25s;}
  .switch.on{background:linear-gradient(120deg, var(--ember-1), var(--ember-2)); border-color:transparent;}
  .switch .knob{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.25s;}
  .switch.on .knob{left:18px;}

  .toast-container{position:fixed; bottom:22px; right:22px; z-index:300; display:flex; flex-direction:column; gap:10px;}
  .toast{background:rgba(18,16,24,0.92); border:1px solid var(--border-hi); padding:12px 16px; border-radius:12px; font-size:13px; font-weight:600;}
  .modal-overlay{position:fixed; inset:0; background:rgba(4,4,7,0.6); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; z-index:200;}
  .modal-overlay.open{display:flex;}
  .modal{width:min(640px,90vw); max-height:70vh; display:flex; flex-direction:column; padding:0;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
  .console-body{padding:14px 20px 20px; overflow-y:auto; font-family:monospace; font-size:12.3px;}
  .console-line{white-space:pre-wrap;}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="toast-container" id="toastContainer"></div>

<div class="modal-overlay" id="consoleOverlay">
  <div class="modal glass">
    <div class="modal-head"><h3>Console</h3><button class="ghost-btn" id="consoleClose">✕</button></div>
    <div class="console-body" id="consoleBody"></div>
  </div>
</div>

<div class="app">

  <div class="titlebar">
    <div class="tb-left"><span class="tb-dot"></span> Ember Launcher · <span id="tbVersion">1.20.4 (Vanilla)</span></div>
    <div class="tb-icons">
      <span id="tbMin">—</span>
      <span id="tbMax">▢</span>
      <span id="tbClose">✕</span>
    </div>
  </div>

  <div class="topbar">
    <div class="brand"><span class="mark"></span>EMBER</div>
    <div class="nav-tabs">
      <button class="nav-tab active" data-page="home">Home</button>
      <button class="nav-tab" data-page="settings">Settings</button>
    </div>

    <!-- Quick Options Dropdown -->
    <div class="quick-config-wrapper">
      <button class="quick-btn" id="quickToggleBtn">⚡ Options ▾</button>
      <div class="quick-flyout" id="quickFlyout">
        <div class="quick-row">
          <span class="quick-label">Player Name</span>
          <input class="quick-input" type="text" id="quickPlayerName" value="Player" maxlength="16">
        </div>
        <div class="quick-select-row">
          <div class="quick-row">
            <span class="quick-label">Loader</span>
            <select class="quick-input" id="quickLoaderSelect">
              <option value="Vanilla">Vanilla</option>
              <option value="Fabric">Fabric</option>
              <option value="Forge">Forge</option>
              <option value="NeoForge">NeoForge</option>
            </select>
          </div>
          <div class="quick-row">
            <span class="quick-label">Version</span>
            <select class="quick-input" id="quickVersionSelect">
              <option value="1.21.1">1.21.1</option>
              <option value="1.20.6">1.20.6</option>
              <option value="1.20.4" selected>1.20.4</option>
              <option value="1.20.1">1.20.1</option>
              <option value="1.19.4">1.19.4</option>
              <option value="1.16.5">1.16.5</option>
              <option value="1.12.2">1.12.2</option>
              <option value="1.8.9">1.8.9</option>
            </select>
          </div>
        </div>
        <div class="quick-row">
          <span class="quick-label">FPS Booster (G1GC)</span>
          <div class="switch on" id="quickFpsSwitch" onclick="this.classList.toggle('on')"><div class="knob"></div></div>
        </div>
      </div>
    </div>
  </div>
  <!-- HOME PAGE -->
  <div class="page active" id="page-home">
    <div class="home-grid">
      <div class="glass player-card">
        <div class="player-top">
          <div class="player-name">
            <h1 id="playerNameH1">Player</h1>
            <span class="badge offline" id="statusBadge">Offline</span>
          </div>
          <div class="top-actions">
            <button class="ghost-btn" id="consoleBtn">⌘ Console</button>
            <button class="ghost-btn" id="folderBtn">📁 Folder</button>
          </div>
        </div>

        <div class="controls-row">
          <div class="pill-select" id="pillVersion">Version: 1.20.4</div>
          <div class="pill-select" id="pillLoader">Loader: Vanilla</div>
          <div class="pill-select" id="ramPill">4.0 GB RAM</div>
        </div>

        <button class="play-btn" id="playBtn">▶ Play</button>
      </div>

      <div class="glass session-card">
        <h3>Memory Allocation</h3>
        <div class="stat-row"><span>RAM</span><span class="ramValue">4096 MB</span></div>
        <input type="range" min="1" max="16" value="4" step="0.5" id="ramSlider">
      </div>
    </div>
  </div>

  <!-- SETTINGS PAGE -->
  <div class="page" id="page-settings">
    <div class="glass" style="padding:22px;">
      <h3>Launcher Settings</h3>
      <div class="sub">Game Root: %AppData%\.ember</div>
    </div>
  </div>

</div>

<script>
  function toast(msg){
    const c = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(()=>el.remove(), 2600);
  }

  // Window Controls
  document.getElementById('tbMin').addEventListener('click', ()=>window.launcherAPI && window.launcherAPI.minimize());
  document.getElementById('tbMax').addEventListener('click', ()=>window.launcherAPI && window.launcherAPI.maximize());
  document.getElementById('tbClose').addEventListener('click', ()=>window.launcherAPI && window.launcherAPI.close());

  // Tabs
  document.querySelectorAll('.nav-tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.nav-tab').forEach(tb=>tb.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('page-'+t.dataset.page).classList.add('active');
    });
  });

  // Quick Dropdown Toggle
  const quickBtn = document.getElementById('quickToggleBtn');
  const quickFlyout = document.getElementById('quickFlyout');
  quickBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    quickFlyout.classList.toggle('open');
  });
  document.addEventListener('click', (e)=>{
    if(!quickFlyout.contains(e.target) && e.target !== quickBtn) quickFlyout.classList.remove('open');
  });

  // State Sync
  const nameInput = document.getElementById('quickPlayerName');
  const versionSelect = document.getElementById('quickVersionSelect');
  const loaderSelect = document.getElementById('quickLoaderSelect');
  const fpsSwitch = document.getElementById('quickFpsSwitch');
  const ramSlider = document.getElementById('ramSlider');
  let memoryMb = 4096;

  function syncUI(){
    const name = nameInput.value || 'Player';
    const v = versionSelect.value;
    const l = loaderSelect.value;
    document.getElementById('playerNameH1').textContent = name;
    document.getElementById('pillVersion').textContent = 'Version: ' + v;
    document.getElementById('pillLoader').textContent = 'Loader: ' + l;
    document.getElementById('tbVersion').textContent = `${v} (${l})`;
  }

  nameInput.addEventListener('input', syncUI);
  versionSelect.addEventListener('change', syncUI);
  loaderSelect.addEventListener('change', syncUI);

  function setRam(gb){
    memoryMb = Math.round(gb * 1024);
    document.querySelectorAll('.ramValue').forEach(el=>el.textContent = memoryMb+' MB');
    document.getElementById('ramPill').textContent = gb.toFixed(1)+' GB RAM';
  }
  ramSlider.addEventListener('input', e=>setRam(parseFloat(e.target.value)));
  setRam(4);

  // Play Execution
  const playBtn = document.getElementById('playBtn');
  const statusBadge = document.getElementById('statusBadge');
  playBtn.addEventListener('click', ()=>{
    if(!window.launcherAPI) { toast('Preview mode'); return; }
    playBtn.disabled = true;
    playBtn.innerHTML = '◌ Launching…';

    window.launcherAPI.launchGame({
      username: nameInput.value.trim() || 'Player',
      version: versionSelect.value,
      loaderType: loaderSelect.value,
      memoryMax: memoryMb,
      fpsBoost: fpsSwitch.classList.contains('on')
    });
  });

  if(window.launcherAPI){
    document.getElementById('folderBtn').addEventListener('click', ()=>window.launcherAPI.openFolder());
    window.launcherAPI.onStatus((status)=>{
      if(status === 'started'){
        playBtn.disabled = false;
        playBtn.innerHTML = '■ Playing';
        statusBadge.textContent = 'Online';
        statusBadge.classList.replace('offline', 'online');
      } else if(status === 'closed'){
        playBtn.disabled = false;
        playBtn.innerHTML = '▶ Play';
        statusBadge.textContent = 'Offline';
        statusBadge.classList.replace('online', 'offline');
      }
    });
    }

  document.getElementById('consoleBtn').addEventListener('click', ()=>document.getElementById('consoleOverlay').classList.add('open'));
  document.getElementById('consoleClose').addEventListener('click', ()=>document.getElementById('consoleOverlay').classList.remove('open'));
</script>

</body>
</html>
