<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinder Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #07090e;
      --accent: #ff6a00;
      --accent-glow: rgba(255, 106, 0, 0.35);
      --glass-base: rgba(15, 18, 26, 0.75);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-hi: rgba(255, 106, 0, 0.3);
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
    }

    .titlebar {
      height: 42px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      -webkit-app-region: drag;
      background: rgba(7, 9, 14, 0.85);
      border-bottom: 1px solid var(--glass-border);
    }

    .titlebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    .titlebar-brand span {
      color: var(--accent);
    }

    .window-controls {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .win-btn:hover { opacity: 1; }
    .btn-close { background: #ef4444; }
    .btn-min { background: #eab308; }
    .btn-max { background: #22c55e; }

    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 42px);
    }

    .sidebar {
      width: 220px;
      background: var(--glass-base);
      border-right: 1px solid var(--glass-border);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .nav-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .nav-btn.active {
      background: var(--glass-border-hi);
      color: var(--text-main);
      border-color: var(--accent);
    }

    .main-view {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--glass-base);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .btn-launch {
      width: 100%;
      background: linear-gradient(135deg, #ff6a00 0%, #ee0979 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: var(--radius-md);
      padding: 16px;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: transform 0.15s, opacity 0.2s;
    }

    .btn-launch:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }

    .btn-launch:active {
      transform: translateY(0);
    }

    .btn-launch:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .console-box {
      background: #000;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      height: 180px;
      overflow-y: auto;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #10b981;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .console-line { word-break: break-all; }
  </style>
</head>
<body>

  <div class="titlebar">
    <div class="titlebar-brand">
      <span>CINDER</span> CLIENT
    </div>
    <div class="window-controls">
      <button class="win-btn btn-min" onclick="window.electronAPI.minimizeWindow()"></button>
      <button class="win-btn btn-max" onclick="window.electronAPI.maximizeWindow()"></button>
      <button class="win-btn btn-close" onclick="window.electronAPI.closeWindow()"></button>
    </div>
  </div>

  <div class="app-body">
    <div class="sidebar">
      <button class="nav-btn active" onclick="switchTab('play')">Play</button>
      <button class="nav-btn" onclick="switchTab('settings')">Settings</button>
      <button class="nav-btn" onclick="window.electronAPI.openGameFolder()">Game Folder</button>
    </div>

    <div class="main-view">
      <!-- Play Tab -->
      <div id="tab-play" class="tab-content active">
        <div class="card">
          <div class="card-title">Instance Launcher</div>
          
          <div class="input-group">
            <label>Player Name</label>
            <input type="text" id="mc-username" value="Player" placeholder="Enter offline or IGN username">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="input-group">
              <label>Minecraft Version</label>
              <select id="mc-version">
                <option value="1.20.4">1.20.4</option>
                <option value="1.20.2">1.20.2</option>
                <option value="1.20.1">1.20.1</option>
                <option value="1.19.4">1.19.4</option>
                <option value="1.16.5">1.16.5</option>
                <option value="1.8.9">1.8.9</option>
              </select>
            </div>
            <div class="input-group">
              <label>Mod Loader</label>
              <select id="mc-loader">
                <option value="Fabric">Fabric (Optimized)</option>
                <option value="Vanilla">Vanilla</option>
              </select>
            </div>
          </div>

          <button id="launch-btn" class="btn-launch" onclick="triggerLaunch()">LAUNCH GAME</button>
        </div>

        <div class="card">
          <div class="card-title">Console Output</div>
          <div class="console-box" id="console-output">
            <div class="console-line">[Cinder] Launcher initialized ready to start.</div>
          </div>
        </div>
      </div>

      <!-- Settings Tab -->
      <div id="tab-settings" class="tab-content">
        <div class="card">
          <div class="card-title">Performance & Memory</div>
          
          <div class="input-group">
            <label>Max Memory (RAM in MB)</label>
            <input type="number" id="ram-limit" value="4096" step="1024">
          </div>

          <div class="input-group">
            <label>Quick Play Server IP (Optional)</label>
            <input type="text" id="server-ip" placeholder="e.g. mc.hypixel.net">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      const target = document.getElementById(`tab-${tabId}`);
      if (target) target.classList.add('active');
      event.target.classList.add('active');
    }

    function addLog(msg) {
      const consoleBox = document.getElementById('console-output');
      const line = document.createElement('div');
      line.className = 'console-line';
      line.innerText = msg;
      consoleBox.appendChild(line);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function triggerLaunch() {
      const btn = document.getElementById('launch-btn');
      btn.disabled = true;
      btn.innerText = 'LAUNCHING...';

      const config = {
        username: document.getElementById('mc-username').value.trim() || 'Player',
        version: document.getElementById('mc-version').value,
        loaderType: document.getElementById('mc-loader').value,
        memoryMax: parseInt(document.getElementById('ram-limit').value) || 4096,
        fpsBoost: true,
        serverIp: document.getElementById('server-ip').value.trim() || null
      };

      addLog(`[Cinder] Initializing launch sequence for Minecraft ${config.version} (${config.loaderType})...`);
      window.electronAPI.launchGame(config);
    }

    window.electronAPI.onGameLog((data) => {
      addLog(data.text);
    });

    window.electronAPI.onGameStatus((status) => {
      const btn = document.getElementById('launch-btn');
      if (status === 'started') {
        btn.innerText = 'GAME RUNNING';
      } else if (status === 'closed') {
        btn.disabled = false;
        btn.innerText = 'LAUNCH GAME';
        addLog('[Cinder] Minecraft process finished.');
      }
    });

    window.electronAPI.onUpdateMessage((msg) => {
      addLog(`[AutoUpdater] ${msg}`);
    });
  </script>
</body>
</html>
