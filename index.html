<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinder Client</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #1f1224, #0d0e15 60%, #050508);
      color: #f4f4f5;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
    }

    /* Title Bar */
    .titlebar {
      height: 40px;
      background: rgba(13, 14, 21, 0.7);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      -webkit-app-region: drag;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #ff5722;
      text-transform: uppercase;
    }

    .brand span {
      color: #ffffff;
    }

    .window-controls {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: background 0.2s, color 0.2s;
    }

    .win-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .win-btn.close:hover {
      background: #e11d48;
      color: #ffffff;
    }

    /* Main Container */
    .app-body {
      flex: 1;
      display: flex;
      padding: 24px;
      gap: 24px;
      overflow: hidden;
    }

    /* Left Panel: Settings */
    .sidebar-panel {
      width: 320px;
      background: rgba(20, 21, 31, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 12px;
      color: #d4d4d8;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: #ff5722;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .toggle-row span {
      font-size: 13px;
      color: #d4d4d8;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .3s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #ff5722;
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    /* Right Panel: Showcase / Launch Area */
    .launch-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(255, 87, 34, 0.05), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1627856013091-fed6e4e30025?q=80&w=1200&auto=format&fit=crop') center/cover;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .launch-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 15, 0.7);
      backdrop-filter: blur(4px);
    }

    .hero-content, .bottom-dock {
      position: relative;
      z-index: 2;
    }

    .hero-tag {
      display: inline-block;
      background: rgba(255, 87, 34, 0.15);
      border: 1px solid rgba(255, 87, 34, 0.3);
      color: #ff784e;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .hero-title {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .hero-sub {
      color: #a1a1aa;
      font-size: 14px;
      max-width: 440px;
      line-height: 1.5;
    }

    /* Launch Actions & Progress Bar */
    .bottom-dock {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      width: 100%;
    }

    .progress-box {
      width: 100%;
      max-width: 340px;
      display: none;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #d4d4d8;
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff5722, #ff9800);
      transition: width 0.25s ease;
      box-shadow: 0 0 10px rgba(255, 87, 34, 0.6);
    }

    .action-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .btn-launch {
      background: linear-gradient(135deg, #ff5722, #e64a19);
      border: none;
      color: #ffffff;
      padding: 14px 44px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 87, 34, 0.4);
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    }

    .btn-launch:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(255, 87, 34, 0.55);
    }

    .btn-launch:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-launch:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    /* Logs Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      width: 700px;
      max-height: 480px;
      background: #0d0e15;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      font-weight: 600;
    }

    .log-viewport {
      padding: 14px;
      font-family: monospace;
      font-size: 12px;
      color: #10b981;
      background: #050508;
      overflow-y: auto;
      height: 380px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <!-- Titlebar -->
  <div class="titlebar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
      </svg>
      Cinder <span>Client</span>
    </div>
    <div class="window-controls">
      <button class="win-btn" id="minBtn">−</button>
      <button class="win-btn" id="maxBtn">□</button>
      <button class="win-btn close" id="closeBtn">✕</button>
    </div>
  </div>

  <!-- App Body -->
  <div class="app-body">
    <!-- Left Panel: Configuration -->
    <div class="sidebar-panel">
      <span class="section-title">Configuration Hub</span>

      <div class="field-group">
        <label>Player Username</label>
        <input type="text" id="usernameInput" value="CinderUser" placeholder="Enter username">
      </div>

      <div class="field-group">
        <label>Minecraft Version</label>
        <select id="versionSelect">
          <option value="1.21.4">1.21.4 (Latest)</option>
          <option value="1.20.4">1.20.4</option>
          <option value="1.20.1">1.20.1</option>
          <option value="1.19.4">1.19.4</option>
          <option value="1.16.5">1.16.5</option>
          <option value="1.8.9">1.8.9 (Legacy)</option>
        </select>
      </div>

      <div class="field-group">
        <label>Mod Engine</label>
        <select id="loaderSelect">
          <option value="Fabric">Fabric (Optimized)</option>
          <option value="Vanilla">Vanilla</option>
          <option value="Forge">Forge</option>
        </select>
      </div>

      <div class="field-group">
        <label>Allocated Memory (RAM)</label>
        <select id="ramSelect">
          <option value="2048">2 GB</option>
          <option value="4096" selected>4 GB (Recommended)</option>
          <option value="6144">6 GB</option>
          <option value="8192">8 GB</option>
        </select>
      </div>

      <div class="toggle-row">
        <span>FPS Boost Flags</span>
        <label class="switch">
          <input type="checkbox" id="fpsBoostToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="field-group" style="margin-top: auto;">
        <button class="btn-secondary" id="openFolderBtn">Open Game Folder</button>
      </div>
    </div>

    <!-- Right Panel: Launch Showcase -->
    <div class="launch-panel">
      <div class="hero-content">
        <div class="hero-tag">High Performance Runtime</div>
        <h1 class="hero-title">Ready for Departure</h1>
        <p class="hero-sub">Equipped with automatic Adoptium Java runtime resolution and Fabric profile streaming.</p>
      </div>

      <div class="bottom-dock">
        <!-- Progress Bar -->
        <div class="progress-box" id="launchProgressContainer">
          <div class="progress-meta">
            <span id="statusLabel">Preparing engine...</span>
            <span id="percentLabel">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-bar-fill" id="launchProgressBar"></div>
          </div>
        </div>

        <!-- Launch Buttons -->
        <div class="action-row">
          <button class="btn-secondary" id="viewLogsBtn">Console</button>
          <button class="btn-launch" id="launchBtn">LAUNCH</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Console Logs Modal -->
  <div class="modal-overlay" id="logsModal">
    <div class="modal-box">
      <div class="modal-header">
        <span>System & Launch Console</span>
        <button class="win-btn close" id="closeLogsBtn">✕</button>
      </div>
      <div class="log-viewport" id="logBox">Waiting for engine start...</div>
    </div>
  </div>

  <script>
    // Titlebar Events
    document.getElementById('minBtn').addEventListener('click', () => window.launcherAPI.minimize());
    document.getElementById('maxBtn').addEventListener('click', () => window.launcherAPI.maximize());
    document.getElementById('closeBtn').addEventListener('click', () => window.launcherAPI.close());
    document.getElementById('openFolderBtn').addEventListener('click', () => window.launcherAPI.openGameFolder());

    // Modal Logs Controls
    const logsModal = document.getElementById('logsModal');
    const logBox = document.getElementById('logBox');
    document.getElementById('viewLogsBtn').addEventListener('click', () => logsModal.style.display = 'flex');
    document.getElementById('closeLogsBtn').addEventListener('click', () => logsModal.style.display = 'none');

    // UI Elements
    const launchBtn = document.getElementById('launchBtn');
    const progressContainer = document.getElementById('launchProgressContainer');
    const progressBar = document.getElementById('launchProgressBar');
    const statusLabel = document.getElementById('statusLabel');
    const percentLabel = document.getElementById('percentLabel');

    // Append logs
    window.launcherAPI.onGameLog((data) => {
      logBox.textContent += `\n${data.text || data}`;
      logBox.scrollTop = logBox.scrollHeight;
    });

    // Handle Launch Progress & Lifecycle
    window.launcherAPI.onGameStatus((status) => {
      progressContainer.style.display = 'block';
      if (status.text) statusLabel.textContent = status.text;
      if (status.percent !== undefined) {
        percentLabel.textContent = `${status.percent}%`;
        progressBar.style.width = `${status.percent}%`;
      }

      if (status.stage === 'loading' || status.stage === 'downloading') {
        launchBtn.disabled = true;
        launchBtn.innerText = 'PREPARING...';
      } else if (status.stage === 'launched') {
        launchBtn.disabled = true;
        launchBtn.innerText = 'PLAYING';
      } else if (status.stage === 'closed') {
        progressContainer.style.display = 'none';
        progressBar.style.width = '0%';
        launchBtn.disabled = false;
        launchBtn.innerText = 'LAUNCH';
      }
    });

    // Handle MCLC Asset Stream Percentage
    window.launcherAPI.onDownloadProgress((prog) => {
      progressContainer.style.display = 'block';
      statusLabel.textContent = `Downloading ${prog.type}...`;
      percentLabel.textContent = `${prog.percent}%`;
      progressBar.style.width = `${prog.percent}%`;
    });

    // Trigger Game Launch
    launchBtn.addEventListener('click', () => {
      const config = {
        username: document.getElementById('usernameInput').value.trim() || 'Player',
        version: document.getElementById('versionSelect').value,
        loaderType: document.getElementById('loaderSelect').value,
        memoryMax: parseInt(document.getElementById('ramSelect').value, 10),
        fpsBoost: document.getElementById('fpsBoostToggle').checked
      };

      logBox.textContent = '[Client] Initiating launch procedure...';
      window.launcherAPI.launchGame(config);
    });
  </script>
</body>
</html>
